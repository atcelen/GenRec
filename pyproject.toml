[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genrec"
version = "1.0.0"
description = "GenRec: Knowing Where to Reconstruct and Where to Generate — generative novel view synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ata Çelen", email = "ata.celen@inf.ethz.ch" },
]
keywords = ["novel-view-synthesis", "diffusion", "3d-reconstruction", "flow-matching"]

# NOTE: PyTorch (>= 2.8, CUDA 12.x) must be installed FIRST, matched to your CUDA
# toolkit (https://pytorch.org/), before installing this package. It is intentionally
# omitted here so pip does not pull a CPU/incompatible wheel.
dependencies = [
    # Diffusion / model stack
    "diffusers==0.32.0",
    "transformers==4.57.1",
    "accelerate==1.11.0",
    "peft==0.17.1",
    "huggingface-hub==0.36.0",
    "safetensors==0.6.2",
    "einops==0.8.1",
    "timm==1.0.26",
    # Geometry / rendering
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@d9839a95f23db082667625a784e5ead6ed9e8e03",
    "roma==1.5.6",
    "trimesh==4.9.0",
    "plyfile==1.1.3",
    # CLIP / perceptual
    "clip @ git+https://github.com/openai/CLIP.git@dcba3cb2e2827b402d2701e7e1c7d9fed8a20ef1",
    "open-clip-torch==2.17.1",
    "lpips==0.1.4",
    "kiui==0.2.19",
    # Metrics (evaluation)
    "torchmetrics==1.8.2",
    "torch_fidelity==0.4.0",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    # IO / numerics / utils
    "numpy==1.26.4",
    "scipy==1.15.3",
    "opencv-python==4.10.0.84",
    "pillow==11.3.0",
    "pillow_heif==1.1.1",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.10.7",
    "plotly==5.24.1",
    "PyYAML==6.0.3",
    "omegaconf==2.3.0",
    "h5py==3.16.0",
    "natsort==8.4.0",
    "jaxtyping==0.2.23",
    "typeguard==2.13.3",
    "colorama==0.4.6",
    "tqdm==4.67.1",
    "rich==14.2.0",
]

[project.optional-dependencies]
dev = ["black==24.*", "isort==5.*", "flake8==7.*", "pre-commit"]
# NVIDIA Warp: optional foreground-occlusion masking (gracefully skipped if absent).
warp = ["warp-lang"]

[project.urls]
# TODO(release): fill in real URLs.
Homepage = "https://atcelen.github.io/GenRec/"
Repository = "https://github.com/atcelen/GenRec"
Model = "https://huggingface.co/atcelen/GenRec"
Paper = "https://arxiv.org/abs/XXXX.XXXXX"

[project.scripts]
genrec-infer = "genrec.cli.inference:main"
genrec-eval-re10k = "genrec.cli.eval_re10k:main"
genrec-eval-dl3dv = "genrec.cli.eval_dl3dv:main"
genrec-eval-mipnerf360 = "genrec.cli.eval_mipnerf360:main"

[tool.setuptools.packages.find]
include = ["genrec*", "depth_anything_3*"]

[tool.setuptools.package-data]
# Vendored component configs + CLIP tokenizer files (no weights).
genrec = ["model_config/**/*"]
depth_anything_3 = ["configs/*.yaml"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
