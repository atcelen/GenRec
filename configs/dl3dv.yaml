# ===============================
# GenRec — DL3DV-10K (+ RE10K) inference config
# ===============================
# Replace the `/path/to/...` placeholders below with your local paths.

experiment:
  use_wandb: false
  run_name: "genrec_dl3dv"
  project_name: "genrec"

  seed: 42
  save_dir: "./experiments/genrec_dl3dv"
  skip_first_val: false
  is_one_batch_overfit: false
  is_resume: false


# ===============================
# Data configuration
# ===============================

data:
  datasets:
    - type: "re10k"
      path: "/path/to/RealEstate10K"
      sampling_weight: 0.5
    - type: "dl3dv"
      path: "/path/to/DL3DV-10K"
      step_size: 4
      longest_side: 616
      sampling_weight: 0.5
  sample_criterion: "sequential"
  step_size: 12
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  max_scenes: null

  # Dynamic T_in/T_out configuration
  dynamic_T: true
  T_in_range: [1, 2]    # T_in sampled from [1, 2]; T_out = num_views - T_in
  T_schedule: "random"
  curriculum_warmup_epochs: 10


# ===============================
# Model configuration
# ===============================

model:
  # Component architecture configs + CLIP tokenizer (vendored in this repo).
  # All component weights come from the GenRec checkpoint; a full SpatialGen
  # weights directory or HuggingFace repo id also works here.
  pretrained_model_name_or_path: "genrec/model_config"
  input_res: 512
  num_views: 8         # Total views (T_in + T_out)
  num_tasks: 2
  from_scratch: false
  noise_scheduler_type: "dpmsolver++"

  ### Conditioning
  zero_init_conv_in: true
  view_concat_condition: true
  input_concat_plucker: true
  input_concat_binary_mask: true
  input_concat_pc_image: true

  ### Integrated Geometry (Depth Anything 3)
  geometry_model_ckpt: "depth-anything/DA3NESTED-GIANT-LARGE"
  geometry_process_res: 616     # DA3 depth resolution used at training time
  geometry_infer_gs: false
  depth_filter_thresh: 0.05     # Forward-warp discontinuity filter (matches training)

  ### UNet configuration
  unet_from_pretrained_kwargs:
    multiview_attention: true
    sparse_mv_attention: false
    disable_mv_attention_in_64x64: false

  ### Architecture flags — these describe the released checkpoint; do not edit
  use_observation_mask: true
  mask_pc_latents: true
  use_region_loss: true
  freeze_unet: true
  dual_ffn: false
  use_vae_skip: true
  lora_rank_vae: 8
  dual_recon: true
  recon_pixel_space: true
  recon_bottleneck: 64
  recon_branch_depth: 4
  recon_K: 8
  recon_last_step_only: true


# ===============================
# Validation configuration
# ===============================

val:
  batch_size: 1
  mixed_precision: "bf16"
  validate_every_epochs: 1
  num_inference_steps: 15
  val_T_in: 1
  compute_distribution_metrics: true
  distribution_metrics_start_epoch: 0

  datasets:
    - type: "re10k"
      path: "/path/to/RealEstate10K"
      scene_list_file: "assets/re10k_test_scenes_100.txt"
      step_size: 10
    - type: "dl3dv"
      path: "/path/to/DL3DV-10K"
      scene_list_file: "assets/dl3dv_test_scenes_100.txt"
      longest_side: 616
      step_size: 4
